{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password | Capstone Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

    *{
        font-family:'Segoe UI',sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#2563eb,#4f8cff);
        padding:20px;
    }

    .password-card{
        width:100%;
        max-width:520px;
        border:none;
        border-radius:20px;
        overflow:hidden;
        box-shadow:0 20px 45px rgba(0,0,0,.18);
    }

    .card-header{
        background:linear-gradient(135deg,#2563eb,#1d4ed8);
        color:#fff;
        padding:35px;
        text-align:center;
        border:none;
    }

    .card-header i{
        font-size:60px;
        margin-bottom:15px;
    }

    .card-body{
        padding:35px;
        background:#fff;
    }

    .form-label{
        font-weight:600;
        margin-bottom:8px;
    }

    .form-control{
        height:50px;
        border:1px solid #ced4da;
        border-radius:12px;
        padding:10px 45px 10px 15px; /* ruang untuk icon */
        margin-bottom:18px;
    }

    .form-control:focus{
        border-color:#2563eb;
        box-shadow:0 0 0 .2rem rgba(37,99,235,.15);
    }

    .password-wrapper{
        position:relative;
    }

    .toggle-password{
        position:absolute;
        top:50%;
        right:15px;
        transform:translateY(-50%);
        cursor:pointer;
        color:#9ca3af;
        font-size:18px;
        transition:.2s;
        z-index:2;
    }

    .toggle-password:hover{
        color:#2563eb;
    }

    .btn-save{
        width:100%;
        height:50px;
        border-radius:12px;
        font-weight:600;
        margin-top:10px;
    }

    .alert{
        border-radius:12px;
    }

    </style>

</head>
<body>

<div class="card password-card">

    <div class="card-header">

        <i class="bi bi-shield-lock-fill"></i>

        <h3 class="fw-bold mb-2">
            Ganti Password
        </h3>

        <p class="mb-0">
            Demi keamanan akun, silakan lengkapi email dan ubah password bawaan sebelum melanjutkan.
        </p>

    </div>

    <div class="card-body">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email Aktif
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Masukkan email aktif"
                    required
                >

            </div>

            <!-- PASSWORD BARU -->

            <div class="mb-3">

            <label class="form-label">
                Password Baru
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password1"
                    name="password1"
                    class="form-control"
                    placeholder="Masukkan password baru"
                    required
                >

                <i class="bi bi-eye toggle-password"
                onclick="togglePassword('password1', this)"></i>

            </div>

        </div>

            <!-- KONFIRMASI PASSWORD -->

            <div class="mb-3">

            <label class="form-label">
                Konfirmasi Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password2"
                    name="password2"
                    class="form-control"
                    placeholder="Ulangi password baru"
                    required
                >

                <i class="bi bi-eye toggle-password"
                onclick="togglePassword('password2', this)">
                </i>

            </div>

        </div>

            <button type="submit" class="btn btn-primary btn-save">

                <i class="bi bi-check-circle-fill me-2"></i>

                Simpan Perubahan

            </button>

        </form>

    </div>

</div>

<script>

function togglePassword(id, icon){

    const input = document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");

    }else{

        input.type = "password";

        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    }

}

</script>

</body>
</html>
