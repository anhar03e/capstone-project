{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Berhasil Diubah | Capstone Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        *{
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2563eb,#4f8cff);
        }

        .card-success{

            width:100%;
            max-width:520px;

            border:none;

            border-radius:20px;

            overflow:hidden;

            box-shadow:0 20px 45px rgba(0,0,0,.18);

        }

        .header{

            background:linear-gradient(135deg,#2563eb,#1d4ed8);

            color:white;

            text-align:center;

            padding:35px;

        }

        .header i{

            font-size:65px;

            margin-bottom:15px;

        }

        .body{

            background:white;

            padding:40px;

            text-align:center;

        }

        .btn-login{

            height:50px;

            border-radius:12px;

            font-weight:600;

        }

        .message{

            color:#6b7280;

            line-height:1.8;

        }

    </style>

</head>
<body>

<div class="card card-success">

    <div class="header">

        <i class="bi bi-check-circle-fill"></i>

        <h3 class="fw-bold">

            Password Berhasil Diubah

        </h3>

    </div>

    <div class="body">

        <h5 class="mb-3">

            Selamat!

        </h5>

        <p class="message">

            Password akun Anda telah berhasil diperbarui.

            <br>

            Silakan login menggunakan password baru.

        </p>

        <div class="d-grid mt-4">

            <a href="{% url 'capstone_system:login' %}" class="btn btn-primary btn-login">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login Sekarang

            </a>

        </div>

    </div>

</div>

</body>
</html>
