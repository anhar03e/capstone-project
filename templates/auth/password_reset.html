{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password | Capstone Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        *{
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2563eb,#4f8cff);
        }

        .card-reset{

            width:100%;
            max-width:470px;

            border:none;
            border-radius:20px;

            overflow:hidden;

            box-shadow:0 20px 45px rgba(0,0,0,.18);

        }

        .card-header{

            background:linear-gradient(135deg,#2563eb,#1d4ed8);

            color:white;

            text-align:center;

            padding:35px;

            border:none;

        }

        .card-header i{

            font-size:55px;

            margin-bottom:15px;

        }

        .card-body{

            padding:35px;

            background:white;

        }

        .form-control{

            height:50px;

            border-radius:12px;

        }

        .btn-reset{

            height:50px;

            border-radius:12px;

            font-weight:600;

        }

        .back-login{

            text-decoration:none;

            font-weight:600;

        }

        .back-login:hover{

            text-decoration:underline;

        }

    </style>

</head>
<body>

<div class="card card-reset">

    <div class="card-header">

        <i class="bi bi-envelope-lock-fill"></i>

        <h3 class="fw-bold mb-2">
            Lupa Password
        </h3>

        <p class="mb-0">
            Masukkan email yang terdaftar untuk menerima link reset password.
        </p>

    </div>

    <div class="card-body">

        {% if form.errors %}

        <div class="alert alert-danger">

            Email tidak ditemukan atau tidak valid.

        </div>

        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    Email

                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Masukkan email..."
                    required
                >

            </div>

            <button class="btn btn-primary w-100 btn-reset">

                <i class="bi bi-send-fill me-2"></i>

                Kirim Link Reset

            </button>

        </form>

        <hr class="my-4">

        <div class="text-center">

            <a href="{% url 'capstone_system:login' %}" class="back-login">

                <i class="bi bi-arrow-left"></i>

                Kembali ke Login

            </a>

        </div>

    </div>

</div>

</body>
</html>
