<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login - Capstone Project</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

/* ================= BODY ================= */
body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI",sans-serif;

    /* Background Biru */
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    overflow:hidden;
}

/* ================= WRAPPER ================= */
.wrapper{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
}

/* Background Blur */
.wrapper::before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    background:rgba(255,255,255,.08);
    border-radius:50%;
    top:-120px;
    left:-120px;
    filter:blur(5px);
}

.wrapper::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:rgba(255,255,255,.08);
    border-radius:50%;
    bottom:-100px;
    right:-100px;
    filter:blur(5px);
}

/* ================= LOGIN CARD ================= */
.login-card{
    position:relative;
    z-index:2;

    width:100%;
    max-width:420px;

    background:#ffffff;

    padding:35px;

    border-radius:18px;

    border:none;

    box-shadow:0 20px 45px rgba(0,0,0,.25);
}

/* ================= TITLE ================= */
.login-title{
    text-align:center;
    font-weight:700;
    font-size:28px;
    color:#2563eb;
}

.login-subtitle{
    text-align:center;
    font-size:14px;
    color:#6b7280;
    margin-bottom:25px;
}

/* ================= LABEL ================= */
.form-label{
    font-weight:600;
    color:#374151;
    font-size:14px;
}

/* ================= INPUT ================= */
.form-control{
    border-radius:10px;
    padding:11px 14px;
    border:1px solid #d1d5db;
    font-size:14px;
    transition:.3s;
}

.form-control:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 .2rem rgba(37,99,235,.15);
}

/* ================= BUTTON ================= */
.btn-primary{
    background:#2563eb;
    border:none;
    border-radius:10px;
    padding:11px;
    font-weight:600;
    transition:.3s;
}

.btn-primary:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(37,99,235,.35);
}

/* ================= PASSWORD ================= */
.password-wrapper{
    position:relative;
}

.toggle-password{
    position:absolute;
    right:14px;
    top:42px;
    cursor:pointer;
    color:#9ca3af;
    font-size:18px;
    transition:.2s;
}

.toggle-password:hover{
    color:#2563eb;
}

/* ================= ALERT ================= */
.login-alert{
    border:none;
    border-radius:10px;
    animation:fadeIn .3s ease;
    font-size:14px;
    margin-bottom:18px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= LINK ================= */
a{
    text-decoration:none;
    color:#2563eb;
    font-size:14px;
    font-weight:500;
}

a:hover{
    color:#1d4ed8;
}

/* ================= FOOTER ================= */
.login-footer{
    text-align:center;
    font-size:12px;
    color:#9ca3af;
    margin-top:18px;
}

/* ================= RESPONSIVE ================= */
@media(max-width:576px){

    .login-card{
        padding:28px 22px;
        border-radius:15px;
    }

    .login-title{
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="wrapper">

    <div class="login-card">

        <h4 class="login-title">
            Capstone Project
        </h4>

        <div class="login-subtitle">
            Silakan login untuk melanjutkan
        </div>

        <!-- NOTIFIKASI -->

        <div id="alert-container">

            {% if messages %}
                {% for message in messages %}

                    <div class="alert alert-{{ message.tags }} login-alert">

                        <i class="bi bi-exclamation-triangle-fill me-2"></i>

                        {{ message }}

                    </div>

                {% endfor %}
            {% endif %}

        </div>

        <!-- FORM LOGIN -->

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    NIM / NIP

                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Masukkan NIM / NIP"
                    required
                >

            </div>

            <div class="mb-3 password-wrapper">

                <label class="form-label">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Masukkan password"
                    required
                >

                <i
                    class="bi bi-eye-slash toggle-password"
                    onclick="togglePassword()">
                </i>

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">

                <i class="bi bi-box-arrow-in-right me-1"></i>

                Login

            </button>

        </form>

        <div class="text-center mt-3">

            <a href="{% url 'capstone_system:password_reset' %}">

                <i class="bi bi-key-fill me-1"></i>

                Lupa Password?

            </a>

        </div>

        <div class="login-footer">

            © Capstone Project

        </div>

    </div>

</div>

<script>

function togglePassword(){

    const input = document.getElementById("password");
    const icon = document.querySelector(".toggle-password");

    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    }else{

        input.type = "password";

        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");

    }

}

// Alert hilang otomatis
document.addEventListener("DOMContentLoaded", function(){

    const alerts = document.querySelectorAll(".login-alert");

    alerts.forEach(function(alert){

        setTimeout(function(){

            alert.style.transition = "opacity .5s ease";

            alert.style.opacity = "0";

            setTimeout(function(){

                alert.remove();

            },500);

        },3000);

    });

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
