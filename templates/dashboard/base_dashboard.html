<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dashboard{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

/* ================= GLOBAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    font-family:"Segoe UI",sans-serif;
    background:#f5f7fb;
    color:#1f2937;
}

/* ================= SIDEBAR ================= */

.sidebar{

    position:fixed;

    top:0;
    left:0;

    width:250px;
    height:100vh;

    background:linear-gradient(180deg,#2563eb,#1d4ed8);

    color:#fff;

    padding:15px 10px;

    display:flex;
    flex-direction:column;

    overflow-y:auto;
    overflow-x:hidden;

    z-index:1050;

    transition:.3s ease;

    box-shadow:4px 0 20px rgba(0,0,0,.18);
}

/* Scrollbar */

.sidebar::-webkit-scrollbar{
    width:6px;
}

.sidebar::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.3);
    border-radius:10px;
}

/* ================= COLLAPSED ================= */

.sidebar.collapsed{
    width:70px;
}

.sidebar.collapsed .menu-text{
    opacity:0;
    width:0;
    overflow:hidden;
}

.sidebar.collapsed .nav-link{
    justify-content:center;
}

/* ================= BRAND ================= */

.sidebar .brand{

    font-size:18px;
    font-weight:700;
    color:#fff;

    text-align:center;

    padding:12px;

    margin-bottom:12px;

    border-bottom:1px solid rgba(255,255,255,.15);
}

/* ================= MENU ================= */

.sidebar .nav-link{

    display:flex;
    align-items:center;

    gap:10px;

    padding:11px 14px;

    color:rgba(255,255,255,.9);

    font-size:14px;

    border-radius:10px;

    transition:.25s;
}

.sidebar .nav-link i{

    min-width:20px;

    font-size:17px;

    text-align:center;

    color:inherit;
}

/* Hover */

.sidebar .nav-link:hover{

    background:rgba(255,255,255,.15);

    color:#fff;

    transform:translateX(4px);
}

/* Menu Aktif */

.sidebar .nav-link.active{

    background:#fff;

    color:#2563eb;

    font-weight:700;

    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.menu-text{

    white-space:nowrap;

    transition:.2s;
}

/* ================= CONTENT ================= */

.dashboard-content{

    margin-left:250px;

    width:calc(100% - 250px);

    min-height:100vh;

    padding:25px;

    overflow-x:hidden;

    transition:.3s;
}

/* Collapse Desktop */

body.sidebar-collapsed .dashboard-content{

    margin-left:70px;

    width:calc(100% - 70px);
}

/* ================= NOTIFICATION ================= */

.notif-container{
    position:relative;
}

.notif-item{
    border:none;
    border-radius:10px;
}

/* ================= OVERLAY ================= */

.sidebar-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    opacity:0;

    visibility:hidden;

    transition:.3s;

    z-index:1040;
}

.sidebar-overlay.show{

    opacity:1;

    visibility:visible;
}

/* ================= MOBILE ================= */

@media (max-width:768px){

    .sidebar{

        left:-260px;

        width:250px;

        box-shadow:none;
    }

    .sidebar.show{

        left:0;

        box-shadow:0 15px 35px rgba(0,0,0,.25);
    }

    .dashboard-content{

        margin-left:0 !important;

        width:100% !important;

        max-width:100%;

        padding:15px;
    }

    body.sidebar-collapsed .dashboard-content{

        margin-left:0;

        width:100%;
    }

}

/* ================= TOGGLE BUTTON ================= */

.toggle-btn{

    position:fixed;

    top:15px;
    left:15px;

    width:42px;
    height:42px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:#fff;

    z-index:1100;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    transition:.3s;
}

.toggle-btn:hover{

    background:#1d4ed8;
}

/* ================= LOGOUT BUTTON ================= */

.sidebar .btn-danger{

    background:#dc3545;
    border:1px solid #dc3545;

    color:#ffffff;

    font-weight:600;

    transition:.25s;
}

.sidebar .btn-danger i{

    color:#ffffff;
}

.sidebar .btn-danger:hover{

    background:#bb2d3b;
    border-color:#bb2d3b;

    color:#ffffff;

    transform:translateY(-2px);

    box-shadow:0 6px 15px rgba(220,53,69,.35);
}

.sidebar .btn-danger:focus{

    box-shadow:0 0 0 .2rem rgba(220,53,69,.25);
}

</style>

{% block extra_css %}{% endblock %}

</head>

<body>

<!-- Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    /* ================= SIMPAN POSISI SCROLL ================= */

    if (sidebar) {

        const savedScroll = localStorage.getItem("sidebarScroll");

        if (savedScroll !== null) {
            sidebar.scrollTop = savedScroll;
        }

        sidebar.addEventListener("scroll", function () {
            localStorage.setItem("sidebarScroll", sidebar.scrollTop);
        });

    }

    /* ================= TUTUP SIDEBAR SAAT KLIK OVERLAY ================= */

    overlay.addEventListener("click", function(){

        sidebar.classList.remove("show");
        overlay.classList.remove("show");

    });

    /* ================= TUTUP SIDEBAR SAAT KLIK MENU (HP) ================= */

    document.querySelectorAll(".sidebar .nav-link").forEach(item => {

        item.addEventListener("click", function(){

            if(window.innerWidth < 768){

                sidebar.classList.remove("show");
                overlay.classList.remove("show");

            }

        });

    });

    /* ================= RESET SAAT KEMBALI KE DESKTOP ================= */

    window.addEventListener("resize", function(){

        if(window.innerWidth >= 768){

            sidebar.classList.remove("show");
            overlay.classList.remove("show");

        }

    });

});
</script>

<!-- SIDEBAR -->
{% block sidebar %}{% endblock %}

<!-- MOBILE TOGGLE -->

<button
class="toggle-btn d-md-none"
onclick="toggleSidebar()">

    <i class="bi bi-list"></i>

</button>

<!-- CONTENT -->

<div class="dashboard-content">

    <!-- NOTIFICATION -->

    {% if messages %}

    <div class="notif-container mb-3">

        {% for message in messages %}

        <div class="alert

        {% if message.tags == 'error' %}
            alert-danger
        {% elif message.tags == 'warning' %}
            alert-warning
        {% else %}
            alert-success
        {% endif %}

        alert-dismissible fade show notif-item">

            {{ message }}

            <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
            </button>

        </div>

        {% endfor %}

    </div>

    {% endif %}

    {% block dashboard_content %}
    {% endblock %}

</div>

<script>

/* ================= MOBILE SIDEBAR ================= */

function toggleSidebar(){

    const sidebar=document.querySelector(".sidebar");
    const overlay=document.getElementById("sidebarOverlay");

    sidebar.classList.toggle("show");
    overlay.classList.toggle("show");

}

/* ================= COLLAPSE DESKTOP ================= */

function collapseSidebar(){

    if(window.innerWidth >= 768){

        document.getElementById("sidebar").classList.toggle("collapsed");
        document.body.classList.toggle("sidebar-collapsed");

    }

}

/* ================= AUTO HIDE NOTIFICATION ================= */

setTimeout(function(){

    document.querySelectorAll(".notif-item").forEach(function(item){

        item.classList.remove("show");

        setTimeout(function(){

            item.remove();

        },300);

    });

},3000);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
